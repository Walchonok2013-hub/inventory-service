services:
  db:
    image: postgres:15
    environment:
      
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory_service-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - default

  app:
    build: .
    env_file:
      - .env     
    container_name: inventory_service-app
    environment:
      - PYTHONUNBUFFERED=1

    working_dir: /app
    # Команда: сначала проверяем, что модуль импортируется, потом стартуем gunicorn
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A app.celery worker --loglevel=info
    user: "1000:1000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/mydb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    # ПРАВИЛЬНАЯ КОМАНДА ДЛЯ BEAT:
    command: celery -A app.celery beat --loglevel=info --scheduler=celery.beat:PersistentScheduler -s /tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:password@db:5432/mydb
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:  