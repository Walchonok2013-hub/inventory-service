services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydb

  worker:
    build: .
    # ВАЖНО: Путь к Celery app. Обычно в FastAPI его создают в app/celery.py или app/main.py
    # Если у вас нет отдельного celery.py, см. Шаг 4.
    command: celery -A app.worker.celery_app worker -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  beat:
    build: .
    command: celery -A app.worker.celery_app beat -l info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: inventory_service-db
    restart: always    
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata: